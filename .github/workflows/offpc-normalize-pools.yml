name: Off-PC Normalize Pools

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Rebuild all normalized pools
        env:
          GITHUB_ACTIONS: "true"
          RUNNER_ENVIRONMENT: "github-hosted"
        run: |
          python scripts/offpc_training/normalize_sources.py
          python scripts/offpc_training/ingest_pikalytics.py
          python scripts/offpc_training/ingest_reddit.py
          python scripts/offpc_training/ingest_youtube.py

      - name: Upload normalized pools
        uses: actions/upload-artifact@v4
        with:
          name: offpc-normalized-pools-${{ github.run_id }}
          path: |
            data/normalized
